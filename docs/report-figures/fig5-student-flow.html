<body><svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig5-title fig5-desc"><title id="fig5-title">學生端流程</title><desc id="fig5-desc">學生端讀取與教務處相同的審查結果，分開真正缺修與可能誤判，輸入本學期修課重新試算；一句話提問由 AI 轉成條件，經程式檢核與學生確認後交給規劃器計算，AI 無法使用時改走手動選項。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><line x1="224" y1="76" x2="272" y2="76" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="224" y1="224" x2="272" y2="224" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="456" y1="76" x2="504" y2="76" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="456" y1="224" x2="504" y2="224" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="688" y1="76" x2="736" y2="76" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="688" y1="224" x2="736" y2="224" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="828" y1="188" x2="828" y2="116" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="596" y1="260" x2="596" y2="332" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="604" y="287" width="64" height="18" rx="2" fill="#ffffff"/><text x="608" y="300" fill="#5a6580" font-size="13" font-weight="400" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">仍未通過</text><path d="M688,372 H940 V76 H924" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="840" y="355" width="64" height="18" rx="2" fill="#ffffff"/><text x="844" y="368" fill="#5a6580" font-size="13" font-weight="400" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="start">手動設定</text><rect x="40" y="40" width="184" height="72" rx="6" fill="#ffffff" stroke="#4f5d75" strok s-serif" text-anchor="middle">手動選項</text><text x="596" y="390" fill="#4f5d75" font-size="13" font-weight="400" font-family="'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="middle">AI 無法使用或不支援時</text></svg></body></html>
