<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>學生 Academic Twin</title>
<link rel="stylesheet" href="assets/common.css">
<style>
/* 學生端專屬樣式，比照系辦端（office.html）：簡約、留白、不用小字；共用 common.css 不動 */
body.student { font-size: 16px; }
.student .sub { font-size: 15px; } .student .req .cite { font-size: 14px; }
.student .course code, .student .course .code { font-size: 13px; } .student .side-tag { font-size: 14px; }
.student .small, .student .muted.small, .student th, .student .chip, .student .issue, .student details summary,
.student .legend, .student .course, .student .whatif label, .student .whatif select, .student .whatif input,
.student .whatif button, .student .term-head, .student .trial { font-size: 15px; }
.student .other, .student .terms { font-size: 14px; }
.student .card { padding: 22px 24px; border-radius: 12px; }
.student h2 { font-size: 20px; margin-bottom: 16px; }
.student h3 { font-size: 17px; }
/* 我的進度：上排四欄橫向並排（學分採計與需要注意疊在最右欄），窄螢幕自動換行 */
.progress-top { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; align-items: start; margin-bottom: 20px; }
.progress-col { display: grid; gap: 16px; }
/* 畢業條件兩欄，由上往下排（像報紙），高矮不一的卡片不留空白；卡片內容由共用 renderRequirements 產生，這裡只調學生端樣式 */
.student #requirements { column-count: 2; column-gap: 12px; }
.student #requirements .req { margin: 0 0 10px; break-inside: avoid; }
/* 進度條放在標題右邊 */
.student #requirements .req { display: grid; grid-template-columns: minmax(0, 1fr) 110px; column-gap: 12px; position: relative; }
.student #requirements .req > * { grid-column: 1 / -1; }
.student #requirements .req > .req-top { grid-column: 1; grid-row: 1; }
.student #requirements .req-top > span { white-space: nowrap; }
.student #requirements .req > .meter { grid-column: 2; grid-row: 1; align-self: center; margin-top: 0 !important; height: 5px; min-width: 0; }
/* 「依據」滑鼠移到卡片上才浮出，不佔版面 */
.student #requirements .req > .cite { display: none; position: absolute; left: 8px; right: 8px; top: 100%; z-index: 5; margin-top: 4px;
  padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 14px rgba(0, 0, 0, .12); }
.student #requirements .req:hover > .cite { display: block; }
/* 已符合的條件收成一行，點開才看 */
.student #requirements .req-ok-group { column-span: all; }
.student #requirements .req-ok-group > summary { cursor: pointer; color: var(--pass); font-weight: 600; padding: 6px 2px; }
.student #requirements .req-ok-list { column-count: 2; column-gap: 12px; margin-top: 8px; }
@media (max-width: 900px) { .student #requirements, .student #requirements .req-ok-list { column-count: 1; } }
</style>
</head>
<body class="student">
<header>
  <div class="bar">
    <div class="brand"><a href="./">NCU <span>Academic Twin</span></a></div>
    <span class="side-tag">學生端</span>
    <div class="sub" id="program"></div>
  </div>
  <nav>
    <button data-view="progress" class="active">我的進度</button>
    <button data-view="plan">修課規劃與 What-if</button>
    <button data-view="graph">先修關係圖</button>
  </nav>
</header>

<!-- 學生端（B 組）。共用外框與樣式見 assets/common.*，變更需通知 A 組 -->
<main>
  <div class="student-head">
    <select id="student-select"></select>
    <span id="student-status"></span>
    <span class="trial" id="trial-badge" title="學生端結果為試算，正式結果以系辦審查為準">試算</span>
    <div><span class="big" id="student-credits"></span> <span class="muted" id="student-total-target"></span></div>
    <span class="muted small" id="student-next"></span>
  </div>

  <!-- 我的進度 -->
  <!-- 比照系辦端學生分頁：上排卡片橫向並排；下方畢業條件整頁寬、兩欄，減少垂直捲動 -->
  <section class="view active" id="view-progress">
    <div class="progress-top">
      <div class="card">
        <h3>目前狀態</h3>
        <div id="summary"></div>
      </div>
      <div class="card">
        <h3>可能是校務系統誤判</h3>
        <div id="flags"></div>
      </div>
      <div class="card">
        <h3>需要找承辦人辦理</h3>
        <div id="actions"></div>
      </div>
      <div class="progress-col">
        <div class="card">
          <h3>學分採計</h3>
          <div class="stack" id="breakdown-bar"></div>
          <div class="legend" id="breakdown-legend"></div>
        </div>
        <div class="card" id="issues-card">
          <h3>需要注意</h3>
          <div id="issues"></div>
        </div>
      </div>
    </div>
    <div class="card" style="margin-bottom:20px">
      <h3>畢業條件 <span class="muted small" id="req-summary"></span></h3>
      <div id="requirements"></div>
    </div>
    <div class="card">
      <details>
        <summary>修課紀錄（<span id="record-count"></span> 筆）</summary>
        <table style="margin-top:8px">
          <thead><tr><th>學期</th><th>課號</th><th>課名</th><th>學分</th><th>成績</th><th>類別</th></tr></thead>
          <tbody id="records"></tbody>
        </table>
      </details>
    </div>
  </section>

  <!-- 修課規劃與 What-if -->
  <section class="view" id="view-plan">
    <div class="grid">
        <div class="card" id="current-card">
          <h3>本學期修課 <span class="trial">試算</span> <span class="muted small" id="current-term"></span></h3>
          <div class="whatif">
            <label style="flex:1 1 260px">本系與管理學院課程
              <input id="cur-search" list="cur-options" placeholder="例如：IM3031 或 電子商務"></label>
            <datalist id="cur-options"></datalist>
            <button class="primary" id="cur-add">加入</button>
          </div>
          <details style="margin:4px 0 8px">
            <summary>其他課程（通識、外系、體育等）</summary>
            <div class="whatif">
              <label>課號 <input id="cur-o-code" style="width:90px" placeholder="CC0215"></label>
              <label>課名 <input id="cur-o-name" style="width:140px"></label>
              <label>學分 <input id="cur-o-credits" type="number" min="0" max="12" value="2" style="width:64px"></label>
              <label>類別 <select id="cur-o-category"><option value="">（外系／不確定）</option></select></label>
              <button class="ghost" id="cur-o-add">加入</button>
            </div>
          </details>
          <div id="current-msg"></div>
          <div id="current-courses"></div>
          <div class="small" id="current-total" style="margin-top:8px"></div>
        </div>
        <div class="card">
          <h3>到畢業的修課路徑</h3>
          <div class="timeline" id="base-plan"></div>
        </div>
        <div class="card">
          <h3>What-if 模擬</h3>
          <div class="whatif">
            <label style="flex:1 1 320px">用一句話問
              <input id="ask-input" type="text" maxlength="300" placeholder="例如：如果我大三下去交換一年，會延畢嗎？"></label>
            <button class="primary" id="ask-run">轉成條件</button>
          </div>
          <div id="ask-result"></div>
          <div class="whatif">
            <label>如果這門課
              <select id="skip-course"><option value="">（不設定）</option></select></label>
            <label>在這學期不修
              <select id="skip-term"></select></label>
            <label>出國交換從
              <select id="away-term"><option value="">（不設定）</option></select></label>
            <label>連續幾學期
              <select id="away-count"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
            <label>每學期可抵學分
              <input id="away-credits" type="number" value="15" min="0" max="25" style="width:80px"></label>
            <button class="primary" id="run-sim">模擬</button>
            <button class="ghost" id="reset-sim">清除</button>
          </div>
          <div id="sim-result"></div>
        </div>
    </div>
  </section>

  <!-- 先修關係圖 -->
  <section class="view" id="view-graph">
    <div class="grid">
      <div class="card">
        <h2>先修關係圖</h2>
        <div class="graph-wrap"><svg id="dag"></svg></div>
        <h3 style="margin-top:16px">其他課程（無先修關係）</h3>
        <div class="courses" id="isolated"></div>
      </div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start">
        <div class="card" id="impact-card"><h3>課程影響範圍</h3></div>
        <div class="card">
          <h3>瓶頸課排行</h3>
          <table><tbody id="bottlenecks"></tbody></table>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="assets/common.js"></script>
<script src="assets/student.js"></script>
</body>
</html>
